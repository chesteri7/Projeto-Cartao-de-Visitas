<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chestão Bank</title>
    <link rel="stylesheet" href="stylelogin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <h2>Chestão Bank</h2>
        <form id="loginForm">
            <label for="username">Usuário:</label>
            <input type="text" id="username" name="username" required>
            <img width="20" height="20" src="https://img.icons8.com/?size=100&id=23264&format=png&color=000000" alt="">
            
            <label for="password">Senha:</label>
            <input type="password" id="password" name="password" required>
            <img width="20" height="20" src="https://img.icons8.com/?size=100&id=94&format=png&color=000000" alt="">
            
            <button type="submit">Entrar</button>
            <p id="message"></p>
        </form>
    </div>
    <script src="scripts.js"></script>
</body>
</html>
