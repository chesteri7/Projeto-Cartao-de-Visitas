<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Formulario</title>
    <link rel="stylesheet" href="styleform.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins&family=Staatliches&display=swap" rel="stylesheet">
    
    
</head>
<body>
    <div class="page">
        <header>
            <h1>Cadastro Do Cliente</h1>
            <p>Por favor Preencha o formulário abaixo com as informações corretas para completar o registro.</p>
        </header>
         <form id="my-form">
            <fieldset>
                <div class="fildset-wrapper">
                    <legend>informações pessoais</legend>
                
                <div class="col-2">
                    <div class="input-wrapper">
                        <label for="name">Nome</label>
                        <input 
                        type="text" 
                        id="name"
                        required />
                    </div>
    
                    <div class="input-wrapper">
                        <label for="Sobrenome">Sobrenome</label>
                        <input type="text" id="Sobrenome" />
                    </div>
                </div>

                <div class="input-wrapper">
                    <label for="email">Email <span>(digite um email válido)</span></label>
                    <input 
                    type="email" 
                    id="email"
                    required />
                </div>

                <div class="input-wrapper">
                    <label for="password">RG <span>(mínimo de 6 caracteres)</span></label>
                    <input 
                    type="number" 
                    id="password"
                    minlength="6" />
                </div>

                <div class="input-wrapper">
                    <label for="password">CPF <span>(mínimo de 6 caracteres)</span></label>
                    <input 
                    type="number" 
                    id="password"
                    minlength="6" />
                </div>

                <div class="input-wrapper">
                    <label for="password">WHATSSAP <span>(DDD)</span></label>
                    <input 
                    type="tel" 
                    id="password"
                    minlength="6" />
                </div>

                <div class="input-wrapper">
                    <label for="password">COMPROVANTE DE ENDEREÇO <span></span></label>
                    <input 
                    type="tel" 
                    id="password"
                    minlength="6" />
                </div> 
            </fieldset>

            <fieldset>
                
         </fieldset>
        </form>
        <footer>
            <input 
            class="button" 
            type="submit"
            form="my-form" 
            value="Salvar">
        </footer>

    </div>
    
</body>
</html>
